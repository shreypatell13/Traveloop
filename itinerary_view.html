<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notes | Traveloop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <style>
        body { background-color: #f8fafc; }

        /* Header Styling */
        .notes-hero {
            padding: 8rem 2rem 6rem;
            background: linear-gradient(135deg, var(--dark-navy) 0%, var(--primary-blue) 100%);
            color: white; text-align: center; position: relative;
        }
        .hero-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; }
        .hero-content h1 { font-size: 3rem; margin-bottom: 0.5rem; color: #ffffff !important; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .hero-content p { font-size: 1.1rem; color: #ffffff !important; opacity: 0.95; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 2rem;}

        /* Controls Area */
        .notes-container { max-width: 1200px; margin: -3rem auto 5rem; padding: 0 2rem; position: relative; z-index: 10; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 2rem; }

        /* Notes Grid */
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }

        /* Note Cards */
        .note-card {
            background: white; border-radius: 24px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: 0.3s;
            display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.5);
        }
        .note-card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(37,99,235,0.15); }
        
        .note-header { background: #eff6ff; padding: 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;}
        .note-header h3 { margin: 0; color: var(--dark-navy); font-size: 1.1rem; font-weight: 700;}
        .note-header .badge { font-size: 0.7rem; color: var(--primary-blue); font-weight: 700; background: white; padding: 0.4rem 0.8rem; border-radius: 50px;}

        /* Body & Activity Lists */
        .note-body { padding: 1.8rem; flex: 1; color: var(--text-gray); font-size: 0.95rem; line-height: 1.6; background: white; }
        
        .activity-list { margin-bottom: 1.5rem; background: #f8fafc; padding: 1rem; border-radius: 12px; border: 1px dashed #cbd5e1; }
        .activity-list ul { margin: 0.5rem 0 0 0; padding-left: 1.5rem; }
        .activity-list li { margin-bottom: 0.4rem; color: var(--dark-navy); }
        .activity-list li span { color: var(--text-gray); font-size: 0.85rem; }
        
        .manual-notes { white-space: pre-wrap; margin-top: 1rem; }

        .note-footer { padding: 1rem 1.5rem; background: #f8fafc; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 10px; }
        .btn-icon { width: 35px; height: 35px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-edit { background: #f1f5f9; color: var(--dark-navy); }
        .btn-delete { background: #fee2e2; color: #ef4444; }
        .btn-edit:hover { background: #e2e8f0; }
        .btn-delete:hover { background: #fecaca; }

        /* Modal Logic */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px); display: none; align-items: center;
            justify-content: center; z-index: 2000; opacity: 0; transition: 0.3s;
        }
        .modal-content {
            background: white; width: 90%; max-width: 500px; padding: 2.5rem;
            border-radius: 28px; transform: translateY(20px); transition: 0.3s;
        }
        .modal-input { width: 100%; padding: 0.9rem; border: 1px solid #e2e8f0; border-radius: 12px; margin-top: 1rem; font-family: inherit; }

        /* Navbar & Footer text fixes */
        .navbar:not(.scrolled) .nav-links a:not(.nav-btn), .navbar:not(.scrolled) .logo, .navbar:not(.scrolled) .hamburger { color: white !important; }
        .footer { background: white; padding: 2rem; border-top: 1px solid #e2e8f0; text-align: center; }

        @media (max-width: 768px) { .notes-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-location-dot"></i> Traveloop</a>
            <div class="nav-links" id="nav-links"></div>
            <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <header class="notes-hero">
        <div class="hero-content">
            <h1>Trip Notes & Plans 📝</h1>
            <p>View your scheduled activities and manual reminders in one place.</p>
        </div>
    </header>

    <main class="notes-container">
        <div class="top-bar">
            <button class="btn btn-primary" onclick="openNoteModal()" style="border-radius: 50px; padding: 0.8rem 2rem;">
                <i class="fa-solid fa-plus"></i> Add New Note
            </button>
        </div>

        <div id="notesGrid" class="notes-grid"></div>

        <div id="emptyState" class="empty-state" style="display: none; text-align: center; padding: 5rem; background: white; border-radius: 24px; border: 2px dashed #cbd5e1;">
            <i class="fa-solid fa-book-open" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
            <h2>No notes found</h2>
            <p style="color: var(--text-gray);">Add activities in the Itinerary Builder or create a manual note here.</p>
        </div>
    </main>

    <footer class="footer">
        <p style="color: var(--text-gray);">&copy; 2026 Traveloop. All rights reserved.</p>
    </footer>

    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <h2 id="modalHeader">Add New Note</h2>
            
            <div style="margin-top: 1.5rem;">
                <label style="font-weight: 600; font-size: 0.85rem;">Select Trip</label>
                <select id="tripSelect" class="modal-input"></select>
            </div>

            <div style="margin-top: 1.5rem;">
                <label style="font-weight: 600; font-size: 0.85rem;">Note Content</label>
                <textarea id="noteContent" class="modal-input" style="height: 150px; resize: none;" placeholder="Enter your reminders, tickets, or plans..."></textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="btn" style="flex:1; background:#f1f5f9;" onclick="closeNoteModal()">Cancel</button>
                <button class="btn btn-primary" style="flex:2;" onclick="saveNote()">Save Note</button>
            </div>
        </div>
    </div>

    <script>
        let trips = [];
        let editingTripId = null;

        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem("loggedIn") !== "true") window.location.href = "login.html";
            
            document.getElementById('nav-links').innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="my-trips.html" class="active" style="color: var(--primary-blue); font-weight: 600;">My Trips</a>
                <a href="explore_trips.html">Explore</a>
                <a href="budget.html">Budget</a>
                <a href="profile.html">Profile</a>
                <a href="#" onclick="logout()" class="nav-btn" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 50px; margin-left: 10px;">Logout</a>
            `;

            loadData();
        });

        function loadData() {
            trips = JSON.parse(localStorage.getItem("trips")) || [];
            renderNotes();
            populateTripSelect();
        }

        function populateTripSelect() {
            const select = document.getElementById('tripSelect');
            select.innerHTML = trips.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const empty = document.getElementById('emptyState');
            
            // Filter: Keep trips that have EITHER text notes OR activities
            const validTrips = trips.filter(t => 
                (t.notes && t.notes.trim() !== "") || 
                (t.activities && t.activities.length > 0)
            );

            if(validTrips.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            grid.innerHTML = validTrips.map(t => {
                
                // 1. Build Activities List HTML
                let actHTML = '';
                if(t.activities && t.activities.length > 0) {
                    actHTML = `
                        <div class="activity-list">
                            <strong style="color: var(--primary-blue); font-size: 0.85rem; text-transform: uppercase;">Planned Activities</strong>
                            <ul>
                                ${t.activities.map(act => `<li><strong>Day ${act.day}:</strong> ${act.name} <span>(${act.time || 'Flexible'})</span></li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                // 2. Build Manual Notes HTML
                let notesHTML = '';
                if(t.notes && t.notes.trim() !== '') {
                    notesHTML = `
                        <div class="manual-notes">
                            <strong style="color: var(--primary-blue); font-size: 0.85rem; text-transform: uppercase;">Extra Notes</strong><br>
                            ${t.notes}
                        </div>
                    `;
                }

                // Combine them into the card
                return `
                <div class="note-card">
                    <div class="note-header">
                        <h3>${t.name}</h3>
                        <span class="badge">${t.destination.split(',')[0]}</span>
                    </div>
                    <div class="note-body">
                        ${actHTML}
                        ${notesHTML}
                    </div>
                    <div class="note-footer">
                        <button class="btn-icon btn-edit" onclick="editNote('${t.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-icon btn-delete" onclick="deleteNote('${t.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openNoteModal() {
            editingTripId = null;
            document.getElementById('modalHeader').innerText = "Add New Note";
            document.getElementById('noteContent').value = "";
            document.getElementById('tripSelect').disabled = false;
            const modal = document.getElementById('noteModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }

        function closeNoteModal() {
            const modal = document.getElementById('noteModal');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function saveNote() {
            const tripId = document.getElementById('tripSelect').value;
            const content = document.getElementById('noteContent').value;

            if(!content) return alert("Please enter some text.");

            const index = trips.findIndex(t => t.id === tripId);
            if(index !== -1) {
                trips[index].notes = content;
                localStorage.setItem("trips", JSON.stringify(trips));
                closeNoteModal();
                loadData();
            }
        }

        function editNote(id) {
            editingTripId = id;
            const trip = trips.find(t => t.id === id);
            document.getElementById('modalHeader').innerText = "Edit Note";
            document.getElementById('tripSelect').value = id;
            document.getElementById('tripSelect').disabled = true;
            document.getElementById('noteContent').value = trip.notes || "";
            
            const modal = document.getElementById('noteModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }

        function deleteNote(id) {
            if(confirm("Are you sure you want to clear the notes and activities for this trip?")) {
                const index = trips.findIndex(t => t.id === id);
                trips[index].notes = "";
                trips[index].activities = []; // This clears activities too!
                localStorage.setItem("trips", JSON.stringify(trips));
                loadData();
            }
        }

        function logout() { localStorage.removeItem('loggedIn'); window.location.href = "login.html"; }
    </script>
</body>
</html>
