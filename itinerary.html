<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Itinerary | Traveloop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <style>
        /* --- Itinerary Builder Specific CSS --- */
        body { background-color: #f1f5f9; }

        /* Header / Banner */
        .itinerary-hero {
            padding: 8rem 2rem 5rem;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.6) 50%, #f1f5f9 100%), 
                              url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&q=80&w=1920');
            background-size: cover; background-position: center;
            color: white; text-align: center; position: relative;
        }

        .hero-content { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; }
        .hero-content h1 { font-size: 2.8rem; color: #ffffff !important; text-shadow: 0 4px 15px rgba(0,0,0,0.8); margin-bottom: 0.5rem; }
        .hero-content p { color: #ffffff !important; text-shadow: 0 2px 10px rgba(0,0,0,0.9); font-weight: 500; opacity: 0.95; }

        /* Stats Glass Card */
        .overview-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px;
            padding: 1.5rem; display: grid; grid-template-columns: repeat(4, 1fr);
            max-width: 800px; margin: 2rem auto 0; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .stat-item { text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .stat-item:last-child { border-right: none; }
        .stat-item h4 { font-size: 1.2rem; margin: 0; }
        .stat-item span { font-size: 0.7rem; text-transform: uppercase; opacity: 0.7; }

        /* Main Layout */
        .itinerary-container { max-width: 1200px; margin: -2rem auto 8rem; padding: 0 2rem; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }

        /* Vertical Timeline Styling */
        .timeline-section { position: relative; padding-left: 2rem; border-left: 3px dashed #cbd5e1; margin-left: 10px; }

        .day-block { background: white; border-radius: 20px; padding: 2rem; margin-bottom: 2rem; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .day-block::after {
            content: ''; position: absolute; left: -2.55rem; top: 2rem; width: 16px; height: 16px;
            background: white; border: 4px solid var(--primary-blue); border-radius: 50%;
        }

        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .day-title { font-size: 1.2rem; color: var(--primary-blue); font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .city-badge { background: var(--bg-light); color: var(--dark-navy); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; border: 1px solid #e2e8f0; }

        /* Activity Cards */
        .activities-list { display: flex; flex-direction: column; gap: 1rem; }
        .activity-card {
            display: flex; align-items: center; gap: 1rem; padding: 1rem;
            background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; transition: 0.3s;
        }
        .activity-card:hover { transform: translateX(10px); border-color: var(--primary-blue); background: #eff6ff; }
        .activity-icon { width: 45px; height: 45px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .activity-info { flex: 1; }
        .activity-info h5 { margin: 0; color: var(--dark-navy); font-size: 1rem; }
        .activity-info p { margin: 0; font-size: 0.8rem; color: var(--text-gray); }
        .activity-cost { font-weight: 700; color: #10b981; font-size: 0.9rem; }

        /* Sidebar Blocks */
        .sticky-sidebar { position: sticky; top: 100px; height: fit-content; }
        .sidebar-card { background: white; border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; color: var(--dark-navy); }

        .budget-progress { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin: 1rem 0; }
        .budget-fill { height: 100%; background: var(--primary-blue); width: 0%; transition: 1s ease; }
        .budget-item { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-gray); }

        .navbar:not(.scrolled) .nav-links a:not(.nav-btn), .navbar:not(.scrolled) .logo { color: white !important; }

        .btn-add { width: 100%; padding: 1rem; border-radius: 12px; border: 2px dashed #cbd5e1; background: transparent; color: var(--text-gray); font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 1rem; }
        .btn-add:hover { border-color: var(--primary-blue); color: var(--primary-blue); background: #eff6ff; }

        .save-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 1rem 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 100; border-top: 1px solid #e2e8f0; }
        .save-bar-content { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }

        /* Modal Styling */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px); display: none; align-items: center;
            justify-content: center; z-index: 2000; opacity: 0; transition: 0.3s;
        }
        .modal-content {
            background: white; width: 90%; max-width: 450px; padding: 2.5rem;
            border-radius: 24px; transform: translateY(20px); transition: 0.3s;
        }
        .modal-input { width: 100%; padding: 0.8rem 1rem; border: 1px solid #e2e8f0; border-radius: 10px; font-family: inherit; margin-top: 5px; }

        .imported-badge { font-size: 0.65rem; background: #d1fae5; color: #047857; padding: 0.2rem 0.5rem; border-radius: 50px; font-weight: 600; margin-left: 5px; vertical-align: middle;}
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-location-dot"></i> Traveloop</a>
            <div class="nav-links" id="nav-links"></div>
            <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <header class="itinerary-hero">
        <div class="hero-content">
            <div class="breadcrumb-container" style="margin-bottom: 1rem;">
                <a href="dashboard.html">Dashboard</a> 
                <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i></span>
                <a href="my_trips.html">My Trips</a>
                <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i></span>
                <span>Itinerary Builder</span>
            </div>
            <h1 id="trip-name">Trip Itinerary Builder</h1>
            <p id="trip-dates">Plan your adventure day-by-day</p>

            <div class="overview-card">
                <div class="stat-item"><h4 id="count-days">0</h4><span>Days</span></div>
                <div class="stat-item"><h4 id="count-activities">0</h4><span>Activities</span></div>
                <div class="stat-item"><h4 id="total-budget">₹0</h4><span>Budget</span></div>
                <div class="stat-item"><h4 id="spent-budget">₹0</h4><span>Spent</span></div>
            </div>
        </div>
    </header>

    <main class="itinerary-container">
        <div class="timeline-section" id="timeline-container"></div>

        <div class="sticky-sidebar">
            <div class="sidebar-card">
                <h4 class="card-title"><i class="fa-solid fa-chart-pie"></i> Budget Tracker</h4>
                <div class="budget-item"><span>Total Budget</span> <strong id="sidebar-total-budget">₹0</strong></div>
                <div class="budget-item"><span>Total Spent</span> <strong id="sidebar-spent">₹0</strong></div>
                <div class="budget-progress"><div class="budget-fill" id="budget-fill-bar"></div></div>
                <p id="budget-status" style="font-size: 0.8rem; text-align: center; color: #10b981;">You are within budget!</p>
                <div style="text-align: center; margin-top: 10px;">
                    <a href="budget.html" style="font-size: 0.8rem; color: var(--primary-blue); text-decoration: none; font-weight: 600;"><i class="fa-solid fa-wallet"></i> Go to Budget Planner</a>
                </div>
            </div>
            <div class="sidebar-card">
                <h4 class="card-title"><i class="fa-solid fa-note-sticky"></i> Trip Notes</h4>
                <textarea id="trip-notes" style="width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; font-family: inherit; font-size: 0.9rem; height: 100px; resize: none;" placeholder="Notes, tickets, contact info..."></textarea>
            </div>
        </div>
    </main>

    <div class="save-bar">
        <div class="save-bar-content">
            <h4 id="save-summary">0 Activities Planned</h4>
            <button class="btn btn-primary" onclick="saveItinerary()" style="padding: 0.8rem 2.5rem; border-radius: 50px;">Save & Finish <i class="fa-solid fa-check-double"></i></button>
        </div>
    </div>

    <div class="modal-overlay" id="activityModal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add Activity📍</h2>
            <input type="hidden" id="target-day">
            
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.8rem; font-weight: 600;">Activity Name</label>
                <input type="text" id="actName" class="modal-input" placeholder="e.g. Scuba Diving">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label style="font-size: 0.8rem; font-weight: 600;">Category</label>
                    <select id="actCat" class="modal-input">
                        <option value="Sightseeing">Sightseeing 📸</option>
                        <option value="Food">Food & Drink 🍕</option>
                        <option value="Flight">Transport ✈️</option>
                        <option value="Hotel">Stay/Hotel 🏨</option>
                        <option value="Adventure">Adventure 🏄‍♂️</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.8rem; font-weight: 600;">Time</label>
                    <input type="time" id="actTime" class="modal-input">
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.8rem; font-weight: 600;">Estimated Cost (₹)</label>
                <input type="number" id="actCost" class="modal-input" value="0">
            </div>

            <div style="display: flex; gap: 1rem;">
                <button class="btn" style="flex:1; background: #f1f5f9;" onclick="closeActivityModal()">Cancel</button>
                <button class="btn btn-primary" style="flex:2;" onclick="addActivity()">Add to Plan</button>
            </div>
        </div>
    </div>

    <script>
        let currentTrip = null;
        let activities = [];
        let manualExpenses = []; // Array to hold expenses from Budget Planner

        const categoryIcons = {
            'Sightseeing': 'fa-camera', 'Food': 'fa-utensils',
            'Flight': 'fa-plane', 'Hotel': 'fa-bed', 'Adventure': 'fa-person-hiking',
            'Hotels': 'fa-bed', 'Flights': 'fa-plane', 'Activities': 'fa-person-hiking', 'Shopping': 'fa-bag-shopping', 'Other': 'fa-receipt'
        };

        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem("loggedIn") !== "true") window.location.href = "login.html";
            
            document.getElementById('nav-links').innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="my_trips.html">My Trips</a>
                <a href="itinerary_view.html">itinerary-view</a>
                <a href="budget.html">Budget</a>
                <a href="#" onclick="logout()" class="nav-btn" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">Logout</a>
            `;

            const urlParams = new URLSearchParams(window.location.search);
            const tripId = urlParams.get('id');
            const trips = JSON.parse(localStorage.getItem("trips")) || [];
            currentTrip = trips.find(t => t.id === tripId);

            if(!currentTrip) { window.location.href = "my_trips.html"; return; }

            // Load both data streams
            activities = currentTrip.activities || [];
            manualExpenses = currentTrip.expenses || []; 
            document.getElementById('trip-notes').value = currentTrip.notes || "";

            renderHeader();
            generateDayBlocks();
            renderActivities(); // This function now renders both lists!
        });

        function renderHeader() {
            document.getElementById('trip-name').innerText = currentTrip.name + " ✈️";
            document.getElementById('total-budget').innerText = "₹" + parseInt(currentTrip.totalBudget).toLocaleString('en-IN');
            document.getElementById('sidebar-total-budget').innerText = "₹" + parseInt(currentTrip.totalBudget).toLocaleString('en-IN');
            
            const start = new Date(currentTrip.startDate);
            const end = new Date(currentTrip.endDate);
            const diff = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
            document.getElementById('count-days').innerText = diff;
            document.getElementById('trip-dates').innerText = `${start.toLocaleDateString('en-GB', {day:'numeric', month:'short'})} - ${end.toLocaleDateString('en-GB', {day:'numeric', month:'short'})} • ${diff} Days`;
        }

        function generateDayBlocks() {
            const start = new Date(currentTrip.startDate);
            const diff = parseInt(document.getElementById('count-days').innerText);
            const container = document.getElementById('timeline-container');
            container.innerHTML = "";

            for(let i=1; i<=diff; i++) {
                const date = new Date(start);
                date.setDate(start.getDate() + (i-1));
                container.innerHTML += `
                    <div class="day-block">
                        <div class="day-header">
                            <div class="day-title">DAY ${i} <span style="font-weight:400; font-size:0.8rem; color:gray">(${date.toLocaleDateString('en-GB', {day:'numeric', month:'short'})})</span></div>
                            <div class="city-badge">${currentTrip.destination.split(',')[0]}</div>
                        </div>
                        <div class="activities-list" id="day-${i}-list"></div>
                        <button class="btn-add" onclick="openActivityModal(${i})">+ Add Activity for Day ${i}</button>
                    </div>`;
            }
        }

        function openActivityModal(day) {
            document.getElementById('target-day').value = day;
            document.getElementById('modal-title').innerText = "Add Activity to Day " + day;
            const modal = document.getElementById('activityModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }

        function closeActivityModal() {
            const modal = document.getElementById('activityModal');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function addActivity() {
            const name = document.getElementById('actName').value;
            const day = parseInt(document.getElementById('target-day').value);
            const cat = document.getElementById('actCat').value;
            const time = document.getElementById('actTime').value;
            const cost = parseInt(document.getElementById('actCost').value) || 0;

            if(!name) return alert("Enter activity name");

            activities.push({ id: Date.now(), day, name, cat, time, cost });
            document.getElementById('actName').value = "";
            document.getElementById('actCost').value = "0";
            closeActivityModal();
            renderActivities();
        }

        function renderActivities() {
            const diff = parseInt(document.getElementById('count-days').innerText);
            const tripStart = new Date(currentTrip.startDate);
            tripStart.setHours(0,0,0,0);

            // Clear lists
            for(let i=1; i<=diff; i++) document.getElementById(`day-${i}-list`).innerHTML = "";

            // 1. Render Normal Activities
            activities.forEach(act => {
                const list = document.getElementById(`day-${act.day}-list`);
                if(list) {
                    list.innerHTML += `
                        <div class="activity-card">
                            <div class="activity-icon"><i class="fa-solid ${categoryIcons[act.cat] || 'fa-map-pin'}"></i></div>
                            <div class="activity-info">
                                <h5>${act.name}</h5>
                                <p><i class="fa-regular fa-clock"></i> ${act.time || 'Flexible'} • ${act.cat}</p>
                            </div>
                            <div class="activity-cost">₹${act.cost.toLocaleString('en-IN')}</div>
                            <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer; margin-left:10px" onclick="deleteAct(${act.id})"></i>
                        </div>`;
                }
            });

            // 2. Render Imported Expenses from Budget Page!
            manualExpenses.forEach(ex => {
                const exDate = new Date(ex.date);
                exDate.setHours(0,0,0,0);
                // Calculate which day of the trip this date falls on
                const dayNum = Math.floor((exDate - tripStart) / (1000 * 60 * 60 * 24)) + 1;
                
                if(dayNum >= 1 && dayNum <= diff) {
                    const list = document.getElementById(`day-${dayNum}-list`);
                    if(list) {
                        list.innerHTML += `
                            <div class="activity-card" style="border-left: 3px solid #10b981; background: #f0fdf4;">
                                <div class="activity-icon" style="background: #10b981; color: white;"><i class="fa-solid ${categoryIcons[ex.cat] || 'fa-receipt'}"></i></div>
                                <div class="activity-info">
                                    <h5>${ex.name} <span class="imported-badge">Budget Item</span></h5>
                                    <p><i class="fa-solid fa-money-bill-transfer"></i> Logged on ${ex.date} • ${ex.cat}</p>
                                </div>
                                <div class="activity-cost" style="color: #10b981;">₹${ex.amount.toLocaleString('en-IN')}</div>
                                <a href="budget.html" style="color:#94a3b8; margin-left:10px; text-decoration:none;" title="Edit in Budget Planner"><i class="fa-solid fa-link"></i></a>
                            </div>`;
                    }
                }
            });

            updateStats();
        }

        function deleteAct(id) {
            activities = activities.filter(a => a.id !== id);
            renderActivities();
        }

        function updateStats() {
            const spentAct = activities.reduce((sum, a) => sum + a.cost, 0);
            const spentExp = manualExpenses.reduce((sum, e) => sum + e.amount, 0);
            const totalSpent = spentAct + spentExp; // Combine both!

            const total = parseInt(currentTrip.totalBudget);
            const percent = Math.min((totalSpent / total) * 100, 100);

            document.getElementById('count-activities').innerText = activities.length + manualExpenses.length;
            document.getElementById('spent-budget').innerText = "₹" + totalSpent.toLocaleString('en-IN');
            document.getElementById('sidebar-spent').innerText = "₹" + totalSpent.toLocaleString('en-IN');
            document.getElementById('budget-fill-bar').style.width = percent + "%";
            document.getElementById('save-summary').innerText = `${activities.length} Activities Planned`;
            
            const status = document.getElementById('budget-status');
            if(totalSpent > total) { status.innerText = "WARNING: Over budget!"; status.style.color = "#ef4444"; }
            else { status.innerText = "You are within budget!"; status.style.color = "#10b981"; }
        }

        function saveItinerary() {
            const trips = JSON.parse(localStorage.getItem("trips")) || [];
            const index = trips.findIndex(t => t.id === currentTrip.id);
            
            if (index !== -1) {
                trips[index].activities = activities;
                trips[index].notes = document.getElementById('trip-notes').value; 
                trips[index].progress = Math.min(40 + (activities.length * 10), 100);

                localStorage.setItem("trips", JSON.stringify(trips));
                
                alert("Itinerary and Notes Saved successfully!");
                window.location.href = "itinerary_view.html"; 
            }
        }

        function logout() { localStorage.removeItem('loggedIn'); window.location.href = "login.html"; }

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });
    </script>
</body>
</html>
